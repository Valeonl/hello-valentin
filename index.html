<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Привет, Валентин</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at 30% 20%, #1d3a5c 0%, #0b1220 55%, #05070d 100%);
    color: #f5f2ea;
    text-align: center;
    padding: 2rem;
  }
  main { display: flex; flex-direction: column; align-items: center; gap: 1.5rem; }
  h1 {
    margin: 0;
    font-size: clamp(2rem, 9vw, 5rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(92deg, #ffd400 0%, #ffb347 45%, #7fd4ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p { margin: 0; color: #9db0c9; font-size: clamp(0.9rem, 2.5vw, 1.1rem); }
  a.play {
    display: inline-block;
    margin-top: .5rem;
    padding: 1rem 2.6rem;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 700;
    font-size: clamp(1rem, 2.6vw, 1.25rem);
    color: #10203a;
    background: linear-gradient(135deg, #ffd400, #ffb347);
    box-shadow: 0 14px 34px rgba(255, 190, 60, .28);
    transition: transform .15s, box-shadow .15s;
  }
  a.play:hover { transform: translateY(-2px); box-shadow: 0 18px 40px rgba(255, 190, 60, .38); }
  a.play:active { transform: scale(.98); }
  small { color: #5f7290; font-size: .82rem; }
</style>
</head>
<body>
  <main>
    <h1>Привет, Валентин</h1>
    <p>Здесь есть мини-игра: пинг-понг на двоих за одним компьютером.</p>
    <a class="play" href="game.html">Играть в пинг-понг</a>
    <small>Левый игрок — W и S · правый — стрелки ↑ и ↓ · до 7 очков</small>
  </main>
</body>
</html>
