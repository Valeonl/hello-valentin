<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Привет, Валентин</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at 30% 20%, #1d3a5c 0%, #0b1220 55%, #05070d 100%);
    color: #f5f2ea;
    text-align: center;
    padding: 2rem;
  }
  h1 {
    margin: 0;
    font-size: clamp(2rem, 9vw, 5rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(92deg, #ffd400 0%, #ffb347 45%, #7fd4ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p { margin: 1.25rem 0 0; color: #9db0c9; font-size: clamp(0.9rem, 2.5vw, 1.1rem); }
</style>
</head>
<body>
  <main>
    <h1>Привет, Валентин</h1>
    <p>Страница собрана и размещена автоматически.</p>
  </main>
</body>
</html>
